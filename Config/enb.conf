#####################################################################
#                   srsENB configuration file
#####################################################################
[enb]
enb_id = 0x01c0
mcc = 432
mnc = 35
mme_addr = 127.0.1.100
gtp_bind_addr = 127.0.1.1
s1c_bind_addr = 127.0.1.1
s1c_bind_port = 0
n_prb = 25
#tm = 4
#nof_ports = 2
#####################################################################
[enb_files]
sib_config = sib.conf
rr_config  = rr.conf
rb_config = rb.conf
#####################################################################
[rf]
#dl_earfcn = 3350
tx_gain = 89
rx_gain = 45


time_adv_nsamples = auto

# MH: 
#device_args = type=b200,master_clock_rate=23.04e6,time_source=internal,clock_source=internal
#device_args = type=b200,master_clock_rate=23.04e6,time_source=internal,clock_source=internal,skip_ref_lock=true
device_args = type=b200,master_clock_rate=23.04e6,time_source=external,clock_source=internal
#device_args = type=b200,master_clock_rate=23.04e6,time_source=external,clock_source=external, send_frame_size=512,recv_frame_size=512


# Example for ZMQ-based operation with TCP transport for I/Q samples
#device_name = zmq
#device_args = fail_on_disconnect=true,tx_port=tcp://*:2000,rx_port=tcp://localhost:2001,id=enb,base_srate=23.04e6

#####################################################################
[pcap]
enable = true
filename = srsRAN_4G/Logs/enb_mac.pcap
#nr_filename = srsRAN_4G/Logs/enb_mac_nr.pcap
s1ap_enable = true
s1ap_filename = srsRAN_4G/Logs/enb_s1ap.pcap

