#####################################################################
#                   srsEPC configuration file
#####################################################################
[mme]
mme_code = 0x1a
mme_group = 0x0001
tac = 0x49fa 
mcc = 432
mnc = 35
mme_bind_addr = 127.0.1.100
apn = srsapn
dns_addr = 8.8.8.8
encryption_algo = EEA0
integrity_algo = EIA1
paging_timer = 2
request_imeisv = false
lac = 0x0006
#####################################################################
[hss]
db_file = srsRAN_4G/Config/user_db.csv

#####################################################################
[spgw]
gtpu_bind_addr   = 127.0.1.100
sgi_if_addr      = 172.16.0.1
sgi_if_name      = srs_spgw_sgi
max_paging_queue = 100

####################################################################
[pcap]
enable   = true
filename = srsRAN_4G/Logs/epc.pcap

#####################################################################
[log]
all_level = info
s1ap_level = debug
all_hex_limit = 32
filename = srsRAN_4G/Logs/epc.log
#nas_level = debug
#s1ap_level = debug
#mme_gtpc_level = debug
#spgw_gtpc_level = debug
#gtpu_level = debug
#spgw_level = debug
#hss_level = debug
